plugins {
    id "com.android.application"
}

def releaseSigningFile = file(providers.gradleProperty("damovesSigningProperties")
    .getOrElse("${System.getProperty('user.home')}/.local/share/damoves/signing/release.properties"))
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace "com.example.soundboard"
    compileSdk 37

    defaultConfig {
        applicationId "com.example.soundboard"
        minSdk 26
        targetSdk 37
        versionCode 4
        versionName "1.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (!releaseSigning.isEmpty()) {
            release {
                storeFile file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (!releaseSigning.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.test:core:1.6.1"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.7.0"
}
