plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

dependencies { implementation 'com.google.code.gson:gson:2.11.0' }

kotlin {
    jvmToolchain(25)
    sourceSets.main.kotlin.srcDir('../app/src/main/java')
    sourceSets.main.kotlin.include('com/example/soundboard/BrowseCore.kt', 'com/example/soundboard/EditorCore.kt', 'com/example/soundboard/PlayerCore.kt', 'com/example/soundboard/NavigationCore.kt', 'com/example/soundboard/behavior/**')
}

application { mainClass = 'com.example.soundboard.behavior.MainKt' }
